name: APK yig'ish

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fayllarni joyiga qo'yish
        run: |
          J=android/app/src/main/java/uz/diyor/odatlar
          R=android/app/src/main/res
          mkdir -p $J
          for f in *.java; do [ -f "$f" ] && mv -f "$f" $J/; done
          # res__papka__nomi.xml  ->  res/papka/nomi.xml
          for f in res__*__*; do
            [ -f "$f" ] || continue
            d=$(echo "$f" | awk -F'__' '{print $2}'); n=$(echo "$f" | awk -F'__' '{print $3}')
            mkdir -p $R/$d && mv -f "$f" $R/$d/$n
          done
          [ -f AndroidManifest.xml ] && mv -f AndroidManifest.xml android/app/src/main/
          [ -f build.gradle ] && mv -f build.gradle android/app/build.gradle
          [ -f app.js ] && mv -f app.js src/app.js
          [ -f index.html ] && mv -f index.html www/index.html
          ls $J $R/layout $R/xml 2>/dev/null || true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Ilovani tayyorlash
        run: |
          npm ci
          npm run build

      - name: APK yig'ish
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: APK'ni olish
        run: cp android/app/build/outputs/apk/release/app-release.apk odatlar-daftari.apk

      - uses: actions/upload-artifact@v4
        with:
          name: odatlar-daftari-apk
          path: odatlar-daftari.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Odatlar daftari 1.0.${{ github.run_number }}
          body: "Telefonda shu sahifani oching va odatlar-daftari.apk faylini yuklab o'rnating."
          files: odatlar-daftari.apk
          make_latest: true
